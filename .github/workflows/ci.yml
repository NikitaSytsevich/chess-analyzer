# Проверки и сборка под Windows и Linux. macOS проверяется на машине
# разработки (`cargo xtask ci`): минуты macOS в Actions в десять раз дороже.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  windows:
    name: Windows — проверки и сборка
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Rust из rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Форматирование
        run: cargo fmt --all --check

      - name: Clippy без предупреждений
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Тесты
        run: cargo test --workspace

      - name: Сборка приложения
        run: cargo xtask bundle --release

      - name: Папка приложения
        uses: actions/upload-artifact@v4
        with:
          name: chess-analyzer-windows-x64
          path: target/release/Шахматный анализатор/
          if-no-files-found: error

  linux:
    name: Linux — проверки и сборка
    # Ubuntu 22.04, а не новее: программа, собранная с её glibc 2.35,
    # запускается и на системах постарше самых свежих.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Окно GPUI (xkbcommon, xcb, Wayland, Vulkan, шрифты) и захват через
      # PipeWire; clang — для привязок к PipeWire.
      - name: Библиотеки для сборки
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libwayland-dev \
            libvulkan-dev libfontconfig-dev libfreetype-dev \
            libpipewire-0.3-dev libclang-dev clang

      # Заголовки PipeWire 0.3.48 из Ubuntu 22.04 старше, чем нужно привязкам
      # pipewire-rs, — берём заголовки 1.0.5 из Ubuntu 24.04. Библиотека при
      # этом остаётся системной, 0.3.48: сборка с ней не пройдёт, если
      # программа позовёт то, чего в старом PipeWire нет.
      - name: Заголовки PipeWire 1.0
        run: |
          dir="$RUNNER_TEMP/pipewire"
          pool=http://archive.ubuntu.com/ubuntu/pool/main/p/pipewire
          mkdir -p "$dir/pkgconfig"
          while read -r package sha256; do
            curl -fsSLo "$dir/$package.deb" "$pool/${package}_1.0.5-1_amd64.deb"
            echo "$sha256  $dir/$package.deb" | sha256sum -c -
            dpkg-deb -x "$dir/$package.deb" "$dir/root"
          done <<'EOF'
          libspa-0.2-dev 6c99d162e23e13cacf8bc3edc312c60545281078398e52e34dc5ebb4209649dc
          libpipewire-0.3-dev c0b34ed6a34391a94c0711966dbea9b6b5a98758d88813824c05d6662e0b60c9
          EOF
          libdir=$(pkg-config --variable=libdir libpipewire-0.3)
          for pc in libspa-0.2 libpipewire-0.3; do
            sed -e "s|^includedir=.*|includedir=$dir/root/usr/include|" \
                -e "s|^libdir=.*|libdir=$libdir|" \
                "$dir/root/usr/lib/x86_64-linux-gnu/pkgconfig/$pc.pc" > "$dir/pkgconfig/$pc.pc"
          done
          echo "PKG_CONFIG_PATH=$dir/pkgconfig" >> "$GITHUB_ENV"
          PKG_CONFIG_PATH="$dir/pkgconfig" pkg-config --cflags --libs libpipewire-0.3

      - name: Rust из rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Форматирование
        run: cargo fmt --all --check

      - name: Clippy без предупреждений
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Тесты
        run: cargo test --workspace

      - name: Сборка приложения
        run: cargo xtask bundle --release

      # Артефакт GitHub упаковывает в zip и теряет права на запуск — tar их
      # сохраняет.
      - name: Архив папки приложения
        run: tar -czf chess-analyzer-linux-x64.tar.gz -C target/release "Шахматный анализатор"

      - name: Папка приложения
        uses: actions/upload-artifact@v4
        with:
          name: chess-analyzer-linux-x64
          path: chess-analyzer-linux-x64.tar.gz
          if-no-files-found: error
