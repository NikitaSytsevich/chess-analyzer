[package]
name = "analyzer-app"
description = "Шахматный анализатор — суфлёр комментатора шахматных трансляций"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "chess-analyzer"
path = "src/main.rs"

[dependencies]
analyzer-capture.workspace = true
analyzer-chess.workspace = true
analyzer-engine.workspace = true
analyzer-session.workspace = true
analyzer-vision.workspace = true
gpui-kit.workspace = true
# Тот же image, что внутри GPUI: превью кадра передаётся ему как image::Frame,
# а иконка окна на Linux читается из PNG.
image = { version = "0.25", default-features = false, features = ["png"] }
raw-window-handle.workspace = true
flume.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-core-foundation.workspace = true
objc2-core-graphics.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
# Dwm — видимые границы окна трансляции и то, не на другом ли оно рабочем столе.
windows = { workspace = true, features = ["Win32_Graphics_Dwm"] }

[target.'cfg(target_os = "linux")'.dependencies]
# SHAPE — пустая область ввода у окна стрелок поверх трансляции: мышь
# проходит сквозь него.
x11rb = { workspace = true, features = ["shape"] }

[lints]
workspace = true
