[package]
name = "analyzer-app"
description = "Шахматный анализатор — суфлёр комментатора шахматных трансляций"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "chess-analyzer"
path = "src/main.rs"

[dependencies]
analyzer-capture.workspace = true
analyzer-chess.workspace = true
analyzer-engine.workspace = true
analyzer-session.workspace = true
analyzer-vision.workspace = true
gpui-kit.workspace = true
# Тот же image, что внутри GPUI: превью кадра передаётся ему как image::Frame,
# а иконка окна на Linux читается из PNG.
image = { version = "0.25", default-features = false, features = ["png"] }
raw-window-handle.workspace = true
flume.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
x11rb.workspace = true

[lints]
workspace = true
