<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Иконка для мелких размеров (16–32 пикселя): та же плашка без полей, конь
    крупнее, шкала оценки толще — в полной иконке они на 16 пикселях
    превращаются в пятно и линию в пиксель. `cargo xtask icons` берёт её для
    мелких размеров .ico и .icns, а полную (icon.svg) — для остальных.
  -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2C32"/>
      <stop offset="1" stop-color="#131416"/>
    </linearGradient>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="9" x2="0" y2="39">
      <stop offset="0" stop-color="#F3CE72"/>
      <stop offset="1" stop-color="#D6A23A"/>
    </linearGradient>
    <clipPath id="bar">
      <rect x="772" y="262" width="92" height="520" rx="46"/>
    </clipPath>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#plate)"/>

  <!-- Конь cburnett, как в полной иконке, но в 19 раз. -->
  <g transform="translate(5 61) scale(19)" fill-rule="evenodd" stroke="#141517" stroke-width="1.5"
     stroke-linecap="round" stroke-linejoin="round">
    <path fill="url(#gold)" d="M22 10c10.5 1 16.5 8 16 29H15c0-9 10-6.5 8-21"/>
    <path fill="url(#gold)" d="M24 18c.38 2.91-5.55 7.37-8 9-3 2-2.82 4.34-5 4-1.042-.94 1.41-3.04 0-3-1 0 .19 1.23-1 2-1 0-4.003 1-4-4 0-2 6-12 6-12s1.89-1.9 2-3.5c-.73-.994-.5-2-.5-3 1-1 3 2.5 3 2.5h2s.78-1.992 2.5-3c1 0 1 3 1 3"/>
    <path fill="#141517" d="M9.5 25.5a.5.5 0 1 1-1 0 .5.5 0 1 1 1 0m5.433-9.75a.5 1.5 30 1 1-.866-.5.5 1.5 30 1 1 .866.5"/>
  </g>

  <g clip-path="url(#bar)">
    <rect x="772" y="262" width="92" height="520" fill="#454952"/>
    <rect x="772" y="460" width="92" height="322" fill="#F1EDE4"/>
  </g>
</svg>
