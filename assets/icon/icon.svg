<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Иконка «Шахматного анализатора»: золотой конь и шкала оценки на
    графитовой плашке — цвета темы приложения (crates/app/src/theme.rs).
    Конь — cburnett из assets/pieces (GPLv2+). Плашка 824×824 с полями под
    тень — сетка иконок macOS; для Windows `cargo xtask icons` берёт одну
    плашку, без полей.
  -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26282D"/>
      <stop offset="1" stop-color="#111214"/>
    </linearGradient>
    <!-- В координатах коня: у обоих контуров фигуры один и тот же градиент, без шва. -->
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="9" x2="0" y2="39">
      <stop offset="0" stop-color="#F0C96A"/>
      <stop offset="1" stop-color="#D29E36"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="bar">
      <rect x="782" y="279" width="60" height="500" rx="30"/>
    </clipPath>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#plate)" filter="url(#shadow)"/>
  <rect x="103" y="103" width="818" height="818" rx="181" fill="none" stroke="#3A3D44" stroke-width="6"/>

  <!-- Конь: фигура 45×45 из набора cburnett, увеличенная в 17 раз. -->
  <g transform="translate(75.5 116) scale(17)" fill-rule="evenodd" stroke="#141517" stroke-width="1.5"
     stroke-linecap="round" stroke-linejoin="round">
    <path fill="url(#gold)" d="M22 10c10.5 1 16.5 8 16 29H15c0-9 10-6.5 8-21"/>
    <path fill="url(#gold)" d="M24 18c.38 2.91-5.55 7.37-8 9-3 2-2.82 4.34-5 4-1.042-.94 1.41-3.04 0-3-1 0 .19 1.23-1 2-1 0-4.003 1-4-4 0-2 6-12 6-12s1.89-1.9 2-3.5c-.73-.994-.5-2-.5-3 1-1 3 2.5 3 2.5h2s.78-1.992 2.5-3c1 0 1 3 1 3"/>
    <path fill="#141517" d="M9.5 25.5a.5.5 0 1 1-1 0 .5.5 0 1 1 1 0m5.433-9.75a.5 1.5 30 1 1-.866-.5.5 1.5 30 1 1 .866.5"/>
  </g>

  <!-- Шкала оценки, как в приложении: сверху чёрные, снизу белые с перевесом. -->
  <g clip-path="url(#bar)">
    <rect x="782" y="279" width="60" height="500" fill="#3A3D44"/>
    <rect x="782" y="469" width="60" height="310" fill="#F1EDE4"/>
  </g>
  <rect x="782" y="279" width="60" height="500" rx="30" fill="none" stroke="#4C5059" stroke-width="4"/>
</svg>
