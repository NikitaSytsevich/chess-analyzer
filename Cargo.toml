[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/app"]

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-or-later"
authors = ["Nikita Sytsevich"]
publish = false

[workspace.dependencies]
# Собственные крейты. Зависимости идут строго в одну сторону:
# app → session → {tracker → {vision, chess}, engine → chess, capture → vision}.
analyzer-capture = { path = "crates/capture" }
analyzer-chess = { path = "crates/chess" }
analyzer-engine = { path = "crates/engine" }
analyzer-session = { path = "crates/session" }
analyzer-tracker = { path = "crates/tracker" }
analyzer-vision = { path = "crates/vision" }

# GPUI ещё не 1.0 и ломает API между версиями — версия зафиксирована точно.
# gpui-kit включает runtime_shaders: шейдеры Metal собираются при запуске,
# поэтому для сборки хватает Command Line Tools, Xcode не нужен.
gpui-kit = "=0.6.6"
screencapturekit = { version = "10.0.3", features = ["macos_15_0"] }
# Уровень окна («поверх всех окон») GPUI меняет только при создании окна —
# после него только напрямую у NSWindow. Версии — те же, что внутри GPUI.
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSGraphics",
    "NSResponder",
    "NSView",
    "NSWindow",
] }
# Стрелки поверх трансляции: место окна трансляции — из списка окон
# CoreGraphics. Версии — те же, что внутри GPUI.
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "CFArray",
    "CFCGTypes",
    "CFDictionary",
    "CFNumber",
    "CFString",
] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
    "std",
    "CGDirectDisplay",
    "CGGeometry",
    "CGWindow",
] }
raw-window-handle = { version = "0.6.2", features = ["std"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
# Linux: X11 — «поверх всех окон» и захват окна там, где нет портала рабочего
# стола. Та же версия, что внутри GPUI; своё подключение без C-библиотек.
x11rb = "0.13.2"
shakmaty = "0.30.1"

anyhow = "1.0.104"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
flume = "0.12"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.dev]
# Полная отладочная информация для GPUI весит гигабайты: оставляем номера строк.
debug = "line-tables-only"

# Зависимости в отладочной сборке тоже оптимизируем: GPUI и разбор кадров
# без оптимизаций заметно тормозят, а пересобираются они редко.
[profile.dev.package."*"]
opt-level = 1

# Распознавание перебирает каждый пиксель кадра: без оптимизаций оно в
# десятки раз медленнее и не укладывается в бюджет даже в отладочной сборке.
[profile.dev.package.analyzer-vision]
opt-level = 3

[profile.dev.package.resvg]
opt-level = 3

[profile.dev.package.tiny-skia]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"
